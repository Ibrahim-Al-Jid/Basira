# Mount a private directory containing openrouter.key on the gateway only.
services:
  model-gateway:
    environment:
      BASIRA_OPENROUTER_KEY: ""
      BASIRA_OPENROUTER_KEY_FILE: /run/basira-provider/openrouter.key
    volumes:
      - type: bind
        source: ${BASIRA_OPENROUTER_SECRET_DIR:?Set the private host directory for openrouter.key}
        target: /run/basira-provider
        read_only: true
        bind:
          create_host_path: false
