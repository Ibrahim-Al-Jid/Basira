name: marsad

x-app: &app
  build: .
  image: marsad-platform:local
  restart: unless-stopped

x-platform: &platform
  MARSAD_PERSONAL_PROJECTS: ${MARSAD_PERSONAL_PROJECTS:-0}
  MARSAD_PLATFORM_DATABASE_URL: postgresql+psycopg://marsad_app:${MARSAD_DB_PASSWORD:?Set MARSAD_DB_PASSWORD}@db/marsad
  MARSAD_REDIS_URL: redis://broker:6379/0
  MARSAD_SOURCE_ADAPTERS: ${MARSAD_SOURCE_ADAPTERS-gitleaks,osv-scanner}

x-model-client: &model-client
  MARSAD_OPENROUTER_MODEL: ${MARSAD_OPENROUTER_MODEL:-}
  MARSAD_PROJECT_MODEL_ENABLED: ${MARSAD_PROJECT_MODEL_ENABLED:-0}
  MARSAD_GATEWAY_URL: ${MARSAD_GATEWAY_URL:-}
  MARSAD_GATEWAY_TOKEN: ${MARSAD_GATEWAY_TOKEN:-}
  MARSAD_OPERATOR_MODEL_ORGS: ${MARSAD_OPERATOR_MODEL_ORGS:-}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: marsad
      POSTGRES_PASSWORD: ${MARSAD_MIGRATION_PASSWORD:?Set MARSAD_MIGRATION_PASSWORD}
      MARSAD_DB_PASSWORD: ${MARSAD_DB_PASSWORD:?Set MARSAD_DB_PASSWORD}
      MARSAD_DISPATCH_PASSWORD: ${MARSAD_DISPATCH_PASSWORD:?Set MARSAD_DISPATCH_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./ops/postgres-init.sh:/docker-entrypoint-initdb.d/10-marsad.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marsad -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  broker:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [internal]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "ops/migrate-platform.py"]
    environment:
      MARSAD_PLATFORM_MIGRATION_URL: postgresql+psycopg://postgres:${MARSAD_MIGRATION_PASSWORD:?Set MARSAD_MIGRATION_PASSWORD}@db/marsad
      MARSAD_MODEL_DB_PASSWORD: ${MARSAD_MODEL_DB_PASSWORD:-}
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]

  app:
    <<: *app
    environment:
      <<: [*platform, *model-client]
      MARSAD_OIDC_ISSUER: ${MARSAD_OIDC_ISSUER:-}
      MARSAD_OIDC_CLIENT_ID: ${MARSAD_OIDC_CLIENT_ID:-}
      MARSAD_OIDC_CLIENT_SECRET: ${MARSAD_OIDC_CLIENT_SECRET:-}
      MARSAD_OIDC_REDIRECT_URI: ${MARSAD_OIDC_REDIRECT_URI:-}
      MARSAD_OIDC_STATE_SECRET: ${MARSAD_OIDC_STATE_SECRET:-}
      MARSAD_PASSWORD_AUTH_ENABLED: ${MARSAD_PASSWORD_AUTH_ENABLED:-0}
      MARSAD_PASSWORD_SELF_SIGNUP: ${MARSAD_PASSWORD_SELF_SIGNUP:-0}
      MARSAD_GITHUB_CLIENT_ID: ${MARSAD_GITHUB_CLIENT_ID:-}
      MARSAD_GITHUB_APP_SLUG: ${MARSAD_GITHUB_APP_SLUG:-}
      MARSAD_GITHUB_CLIENT_SECRET: ${MARSAD_GITHUB_CLIENT_SECRET:-}
      MARSAD_GITHUB_CALLBACK_URL: ${MARSAD_GITHUB_CALLBACK_URL:-}
      MARSAD_GITHUB_CREDENTIAL_KEY: ${MARSAD_GITHUB_CREDENTIAL_KEY:-}
      MARSAD_APPROVED_WEBSITE_PAGES: ${MARSAD_APPROVED_WEBSITE_PAGES:-}
      MARSAD_INTAKE_S3_BUCKET: ${MARSAD_INTAKE_S3_BUCKET:-}
      MARSAD_INTAKE_S3_ENDPOINT: ${MARSAD_INTAKE_S3_ENDPOINT:-}
      MARSAD_INTAKE_STORAGE_REQUIRED: ${MARSAD_INTAKE_STORAGE_REQUIRED:-0}
      AWS_DEFAULT_REGION: ${MARSAD_INTAKE_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MARSAD_INTAKE_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${MARSAD_INTAKE_S3_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${MARSAD_INTAKE_S3_SESSION_TOKEN:-}
    ports: ["127.0.0.1:${MARSAD_PORT:-8765}:8000"]
    volumes: [anonymous:/srv/marsad/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, egress]

  dispatcher:
    <<: *app
    command: ["python", "-m", "backend.platform_jobs"]
    environment:
      <<: *platform
      MARSAD_PLATFORM_DATABASE_URL: postgresql+psycopg://marsad_dispatch:${MARSAD_DISPATCH_PASSWORD:?Set MARSAD_DISPATCH_PASSWORD}@db/marsad
    depends_on:
      migrate: {condition: service_completed_successfully}
      broker: {condition: service_healthy}
    networks: [internal]

  worker:
    <<: *app
    command: ["celery", "-A", "backend.platform_jobs:celery_app", "worker", "--concurrency", "2", "--loglevel", "WARNING"]
    environment:
      <<: [*platform, *model-client]
      MARSAD_ANALYSIS_SPOOL: /srv/marsad/spool
    volumes: [spool:/srv/marsad/spool]
    depends_on:
      migrate: {condition: service_completed_successfully}
      broker: {condition: service_healthy}
      scanner: {condition: service_started}
    networks: [internal]

  scanner:
    <<: *app
    build:
      context: .
      target: scanner-npm
    image: marsad-platform:scanner-local
    command: ["python", "-m", "backend.offline_worker"]
    environment:
      MARSAD_ANALYSIS_SPOOL: /srv/marsad/spool
      MARSAD_SOURCE_ADAPTERS: ${MARSAD_SOURCE_ADAPTERS-gitleaks,osv-scanner}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: [spool:/srv/marsad/spool]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    mem_limit: 400m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  model-secrets:
    <<: *app
    profiles: [model]
    restart: "no"
    command: ["python", "ops/init-model-vault.py"]
    volumes: [model-secrets:/srv/marsad/model-secrets]
    network_mode: none

  model-gateway:
    <<: *app
    profiles: [model]
    command: ["python", "-m", "uvicorn", "backend.model_gateway:app", "--no-access-log", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *model-client
      MARSAD_PLATFORM_DATABASE_URL: postgresql+psycopg://marsad_model_gateway:${MARSAD_MODEL_DB_PASSWORD:-}@db/marsad
      MARSAD_MODEL_MASTER_KEY_FILE: /srv/marsad/model-secrets/master.key
    volumes: [model-secrets:/srv/marsad/model-secrets:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      model-secrets: {condition: service_completed_successfully}
    networks: [internal, egress]

networks:
  internal: {internal: true}
  egress: {}
volumes:
  database: {}
  anonymous: {}
  redis: {}
  spool: {}
  model-secrets: {}
