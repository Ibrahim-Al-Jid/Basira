# Workstation profile: keep the existing anonymous report database on the host.
# Personal projects (accounts, projects, Connect GitHub) are on for every service
# that reads the flag, so .env.local does not need a BASIRA_PERSONAL_PROJECTS line.
services:
  app:
    environment:
      BASIRA_PERSONAL_PROJECTS: "1"
      BASIRA_PASSWORD_AUTH_ENABLED: "1"
      BASIRA_PASSWORD_SELF_SIGNUP: "1"
    volumes:
      - ./data:/srv/basira/data
  dispatcher:
    environment:
      BASIRA_PERSONAL_PROJECTS: "1"
  worker:
    environment:
      BASIRA_PERSONAL_PROJECTS: "1"
