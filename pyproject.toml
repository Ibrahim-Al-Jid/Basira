# Tooling configuration for the repository. Runtime dependencies stay in
# requirements.txt; this file only configures the tools CI runs.

[tool.ruff]
target-version = "py313"
line-length = 120
# The fixtures under tests/fixtures are deliberately vulnerable sample code.
extend-exclude = ["frontend", "docs", "tests/fixtures"]

[tool.ruff.lint]
# Defect rules only. Style is not enforced yet: the existing code has not been
# formatted to one style, and a style gate added now would bury the defects
# this gate exists to catch. Widen the selection as the code is cleaned.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["backend"]
