name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the running job obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the development requirements
        run: pip install -r requirements-dev.txt
      - name: Lint for defects (undefined names, broken comparisons, unreachable statements)
        run: python -m ruff check .
      - name: Check that the installed requirements resolve together
        run: pip check
      - name: Scan the repository and its history for secrets
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --log-opts="--all"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_EVAL_NETWORK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Build the frontend (backend tests serve frontend/dist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Replay timing unit tests
        run: node --test frontend/src/replay.test.mjs frontend/src/dashboard.test.mjs
      - name: Backend tests (includes self-security tests)
        run: python -m pytest backend -q
      - name: Quality gate (corpus and DVWA, fails on a drop in precision or recall or a rise in false positives)
        run: python -m backend.quality_gate --network
