name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_EVAL_NETWORK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Build the frontend (backend tests serve frontend/dist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Replay timing unit tests
        run: node --test frontend/src/replay.test.mjs frontend/src/dashboard.test.mjs
      - name: Backend tests (includes self-security tests)
        run: python -m pytest backend -q
      - name: Quality gate (corpus and DVWA, fails on a drop in precision or recall or a rise in false positives)
        run: python -m backend.quality_gate --network

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: basira
          POSTGRES_PASSWORD: ci-migration-password
          BASIRA_DB_PASSWORD: ciapppassword
          BASIRA_DISPATCH_PASSWORD: cidispatchpassword
        options: >-
          --health-cmd "pg_isready -U postgres -d basira"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
        ports: ["5432:5432"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-migration-password
      BASIRA_PLATFORM_MIGRATION_URL: postgresql+psycopg://postgres:ci-migration-password@127.0.0.1:5432/basira
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Provision the database roles the same way a deployment does
        run: |
          POSTGRES_USER=postgres POSTGRES_DB=basira \
          BASIRA_DB_PASSWORD=ciapppassword BASIRA_DISPATCH_PASSWORD=cidispatchpassword \
          sh ops/postgres-init.sh
      - name: Migrate a fresh database to head
        run: python -m alembic upgrade head
      - name: Migrations and models agree
        run: python -m alembic check
      - name: Migrations reverse to an empty database and apply again
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: PostgreSQL schema guards (row level security, definer functions, trigger, roles)
        run: python -m pytest backend/test_postgres_schema.py -q
