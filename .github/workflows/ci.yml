name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_EVAL_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Backend tests (includes self-security tests)
        run: python -m pytest backend -q
      - name: Quality gate (corpus and DVWA, fails on a drop in precision or recall or a rise in false positives)
        run: python -m backend.quality_gate --network
