name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the running job obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the development requirements
        run: pip install -r requirements-dev.txt
      - name: Lint for defects (undefined names, broken comparisons, unreachable statements)
        run: python -m ruff check .
      - name: Check that the installed requirements resolve together
        run: pip check
      - name: Scan the repository and its history for secrets
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --log-opts="--all"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_EVAL_NETWORK: "1"
      BASIRA_EVAL_CACHE: /tmp/basira-dvwa-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Build the frontend (backend tests serve frontend/dist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Replay timing unit tests
        run: node --test frontend/src/replay.test.mjs frontend/src/dashboard.test.mjs
      - name: Backend tests (includes self-security tests)
        run: python -m pytest backend -q
      # Digest-named download cache for the pinned DVWA files; entries are still
      # sha256-verified on every read, so a poisoned cache fails the same check
      # a bad download would. Keyed on the manifest so a re-pin starts fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/basira-dvwa-cache
          key: dvwa-${{ hashFiles('tests/fixtures/detection-targets/manifest.json') }}
      - name: Quality gate (corpus and DVWA, fails on a drop in precision or recall or a rise in false positives)
        run: python -m backend.quality_gate --network

  container:
    name: Container build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build --tag basira:ci .
      - name: Start the container and check that the app answers
        run: |
          docker run --detach --name basira-ci --publish 127.0.0.1:8000:8000 basira:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/product; then ready=1; break; fi
            sleep 2
          done
          docker logs basira-ci
          test "${ready:-}" = "1"
  browser-smoke:
    name: Browser smoke and container acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # Exercises the documented bootstrap path end to end: env file, compose up, readiness wait.
      - name: Start the full local deployment with the bootstrap script
        # bash explicitly: ops/start-local.sh is tracked 644 in git, and the
        # web flow cannot set the exec bit (tracked separately).
        run: bash ops/start-local.sh --port 8901
      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke (signup, real ZIP scan, 9 pages in English and Arabic)
        run: BASIRA_QA_ORIGIN=http://127.0.0.1:8901 python tests/browser_smoke.py
      - name: Browser acceptance - personal projects
        run: python browser_personal_projects.py
        working-directory: tests
        env:
          BASIRA_QA_ORIGIN: http://127.0.0.1:8901
      - name: Compose state and logs (personal mode)
        if: always()
        # Guarded: when the boot step never ran there is no .env.local, and an
        # unguarded compose call fails and buries the real error.
        run: |
          if [ -f .env.local ]; then
            docker compose -p basira-local -f compose.yaml -f compose.local.yaml --env-file .env.local ps
            docker compose -p basira-local -f compose.yaml -f compose.local.yaml --env-file .env.local logs --tail=150
          else
            echo "deployment never started; nothing to dump"
          fi
      - name: Stop the personal deployment
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose -p basira-local -f compose.yaml -f compose.local.yaml --env-file .env.local down
          fi
      # container_smoke.py exercises team-mode routes (organizations, grants,
      # cross-org RLS) that the personal-mode middleware deliberately 404s, so
      # it needs its own deployment without compose.local.yaml. This also gives
      # the team-mode deployment shape its first automated coverage. The test
      # mints sessions in the database itself, so password auth is not needed.
      # Password auth + self-signup on for the account suites, and the model
      # profile up: the credential UI's first GET must see the gateway answer
      # /managed-health ready (vault key + provisioned role + credential
      # functions), which the migrate service sets up when the model password
      # is present. Passwords/tokens are generated per run; the stack is
      # ephemeral. Shell env wins over --env-file in compose interpolation.
      - name: Start the team-mode deployment
        run: |
          export BASIRA_PASSWORD_AUTH_ENABLED=1 BASIRA_PASSWORD_SELF_SIGNUP=1
          export BASIRA_MODEL_DB_PASSWORD="$(openssl rand -hex 24)"
          export BASIRA_GATEWAY_TOKEN="$(openssl rand -hex 24)"
          export BASIRA_GATEWAY_URL="http://model-gateway:8001"
          docker compose -p basira-team -f compose.yaml --env-file .env.local --profile model up -d --build --wait
      # RLS, worker path and report generation against the isolated Compose project.
      - name: Container acceptance
        run: docker compose -p basira-team -f compose.yaml --env-file .env.local exec -T app python - < tests/container_smoke.py
      # Account hub, invitation and project-access flow, credential UI, layouts.
      # No scans, so it adds seconds, not minutes.
      - name: Browser acceptance - account, invitations, access, credentials
        run: python browser_account.py
        working-directory: tests
        env:
          BASIRA_TEST_PLATFORM_URL: http://127.0.0.1:8901
      - name: Browser acceptance - workspace routing and report scope
        run: python browser_workspace.py
        working-directory: tests
        env:
          BASIRA_TEST_PLATFORM_URL: http://127.0.0.1:8901
      - name: Browser acceptance - password signup, login and isolation
        run: python browser_password_login.py
        working-directory: tests
        env:
          BASIRA_TEST_PLATFORM_URL: http://127.0.0.1:8901
      - name: Browser acceptance - source intake and linked evidence
        run: python browser_source_intake.py
        working-directory: tests
        env:
          BASIRA_TEST_PLATFORM_URL: http://127.0.0.1:8901
      - name: Browser acceptance - release acceptance
        run: python tests/browser_release.py --password-account
        working-directory: tests
        env:
          BASIRA_TEST_PLATFORM_URL: http://127.0.0.1:8901
      - name: Compose state and logs (team mode)
        if: always()
        run: |
          docker compose -p basira-team -f compose.yaml --env-file .env.local ps || true
          docker compose -p basira-team -f compose.yaml --env-file .env.local logs --tail=150 || true
      - name: Stop the team deployment
        if: always()
        run: docker compose -p basira-team -f compose.yaml --env-file .env.local down || true
