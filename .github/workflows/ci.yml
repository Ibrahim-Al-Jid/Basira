name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_EVAL_NETWORK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Build the frontend (backend tests serve frontend/dist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Replay timing unit tests
        run: node --test frontend/src/replay.test.mjs frontend/src/dashboard.test.mjs
      - name: Backend tests (includes self-security tests)
        run: python -m pytest backend -q
      - name: Quality gate (corpus and DVWA, fails on a drop in precision or recall or a rise in false positives)
        run: python -m backend.quality_gate --network
