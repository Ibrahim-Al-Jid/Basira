name: postgres schema

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: basira
          POSTGRES_PASSWORD: ci-migration-password
          BASIRA_DB_PASSWORD: ciapppassword
          BASIRA_DISPATCH_PASSWORD: cidispatchpassword
        options: >-
          --health-cmd "pg_isready -U postgres -d basira"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
        ports: ["5432:5432"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-migration-password
      BASIRA_PLATFORM_MIGRATION_URL: postgresql+psycopg://postgres:ci-migration-password@127.0.0.1:5432/basira
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Provision the database roles the same way a deployment does
        run: |
          POSTGRES_USER=postgres POSTGRES_DB=basira \
          BASIRA_DB_PASSWORD=ciapppassword BASIRA_DISPATCH_PASSWORD=cidispatchpassword \
          sh ops/postgres-init.sh
      - name: Migrate a fresh database to head
        run: python -m alembic upgrade head
      - name: Migrations and models agree
        run: python -m alembic check
      - name: Migrations reverse to an empty database and apply again
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: PostgreSQL schema guards (row level security, definer functions, trigger, roles)
        run: python -m pytest backend/test_postgres_schema.py -q
